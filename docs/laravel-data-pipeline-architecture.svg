<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%" style="background:#0f172a; font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;">
  <defs>
    <linearGradient id="grad-header" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="grad-stage" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="grad-sink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="grad-quarantine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.4" />
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10b981" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#ef4444" />
    </marker>
  </defs>

  <!-- Title / Header -->
  <rect x="50" y="30" width="1100" height="70" rx="12" fill="url(#grad-header)" filter="url(#shadow)" />
  <text x="75" y="72" fill="#ffffff" font-size="22" font-weight="700">Laravel Data Pipeline Architecture &amp; Lifecycle</text>
  <text x="820" y="72" fill="#93c5fd" font-size="14" font-weight="500">Release validation | Laravel 12 &amp; 13</text>

  <!-- 1. Input Sources -->
  <rect x="50" y="140" width="220" height="240" rx="10" fill="url(#grad-stage)" stroke="#334155" stroke-width="2" filter="url(#shadow)" />
  <text x="70" y="175" fill="#38bdf8" font-size="16" font-weight="700">1. INPUT SOURCES</text>
  <line x1="70" y1="185" x2="250" y2="185" stroke="#334155" stroke-width="1.5" />
  <rect x="70" y="200" width="180" height="35" rx="6" fill="#1e293b" stroke="#475569" />
  <text x="85" y="222" fill="#e2e8f0" font-size="12">LazyCollection / Generator</text>
  <rect x="70" y="245" width="180" height="35" rx="6" fill="#1e293b" stroke="#475569" />
  <text x="85" y="267" fill="#e2e8f0" font-size="12">Eloquent Builder ::cursor()</text>
  <rect x="70" y="290" width="180" height="35" rx="6" fill="#1e293b" stroke="#475569" />
  <text x="85" y="312" fill="#e2e8f0" font-size="12">CsvSource (O(1) file stream)</text>
  <text x="75" y="360" fill="#94a3b8" font-size="11">Chunked Streaming Boundary</text>

  <!-- Arrow to Dispatcher -->
  <path d="M 270 260 L 330 260" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />

  <!-- 2. Execution Orchestration -->
  <rect x="330" y="140" width="240" height="240" rx="10" fill="url(#grad-stage)" stroke="#334155" stroke-width="2" filter="url(#shadow)" />
  <text x="350" y="175" fill="#f59e0b" font-size="16" font-weight="700">2. ORCHESTRATION</text>
  <line x1="350" y1="185" x2="550" y2="185" stroke="#334155" stroke-width="1.5" />
  <rect x="350" y="200" width="200" height="45" rx="6" fill="#1e293b" stroke="#475569" />
  <text x="365" y="220" fill="#e2e8f0" font-size="12" font-weight="600">Synchronous (run)</text>
  <text x="365" y="235" fill="#94a3b8" font-size="10">O(chunkSize) memory stream</text>
  <rect x="350" y="255" width="200" height="55" rx="6" fill="#1e293b" stroke="#475569" />
  <text x="365" y="275" fill="#e2e8f0" font-size="12" font-weight="600">Distributed Batch (queue)</text>
  <text x="365" y="290" fill="#94a3b8" font-size="10">Bus::batch([]) upfront staging</text>
  <text x="365" y="302" fill="#94a3b8" font-size="10">Queue assembly buffers payloads</text>
  <rect x="350" y="320" width="200" height="45" rx="6" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5" />
  <text x="365" y="340" fill="#60a5fa" font-size="11" font-weight="600">Chunk Lease Guard</text>
  <text x="365" y="353" fill="#94a3b8" font-size="10">Token fencing + stale lease expiry</text>

  <!-- Arrow to Stages -->
  <path d="M 570 260 L 630 260" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />

  <!-- 3. Chunk Execution Pipeline -->
  <rect x="630" y="140" width="250" height="240" rx="10" fill="url(#grad-stage)" stroke="#334155" stroke-width="2" filter="url(#shadow)" />
  <text x="650" y="175" fill="#a855f7" font-size="16" font-weight="700">3. CHUNK EXECUTOR</text>
  <line x1="650" y1="185" x2="860" y2="185" stroke="#334155" stroke-width="1.5" />
  <rect x="650" y="200" width="210" height="35" rx="6" fill="#1e293b" stroke="#475569" />
  <text x="665" y="222" fill="#e2e8f0" font-size="11">Dedup: atomic cache + DB journal</text>
  <rect x="650" y="245" width="210" height="35" rx="6" fill="#1e293b" stroke="#475569" />
  <text x="665" y="267" fill="#e2e8f0" font-size="11">BatchValidator (0 N+1 rules)</text>
  <rect x="650" y="290" width="210" height="35" rx="6" fill="#1e293b" stroke="#475569" />
  <text x="665" y="312" fill="#e2e8f0" font-size="11">ResolveRelation (bulk whereIn)</text>
  <text x="655" y="355" fill="#94a3b8" font-size="10">RecordContext / RecordChunk flow</text>

  <!-- Arrow from Stages to Persistence -->
  <path d="M 880 230 L 940 230" stroke="#10b981" stroke-width="2" marker-end="url(#arrow-green)" />
  <path d="M 880 320 L 940 470" stroke="#ef4444" stroke-width="2" marker-end="url(#arrow-red)" />

  <!-- 4. Persistence Sinks -->
  <rect x="940" y="140" width="210" height="170" rx="10" fill="url(#grad-stage)" stroke="#10b981" stroke-width="2" filter="url(#shadow)" />
  <text x="960" y="175" fill="#34d399" font-size="16" font-weight="700">4. TERMINAL SINKS</text>
  <line x1="960" y1="185" x2="1130" y2="185" stroke="#334155" stroke-width="1.5" />
  <rect x="955" y="195" width="180" height="26" rx="5" fill="#1e293b" stroke="#10b981" />
  <text x="965" y="213" fill="#a7f3d0" font-size="11">InsertSink / UpsertSink</text>
  <rect x="955" y="225" width="180" height="26" rx="5" fill="#1e293b" stroke="#10b981" />
  <text x="965" y="243" fill="#a7f3d0" font-size="11">ModelSink (Events &amp; Casts)</text>
  <rect x="955" y="255" width="180" height="26" rx="5" fill="#1e293b" stroke="#10b981" />
  <text x="965" y="273" fill="#a7f3d0" font-size="11">CustomSink (SinkResult)</text>
  <text x="960" y="300" fill="#6ee7b7" font-size="10" font-weight="600">Atomic sink + checkpoint: same DB</text>

  <!-- 5. Checkpoints & Quarantine -->
  <rect x="940" y="440" width="210" height="290" rx="10" fill="url(#grad-stage)" stroke="#ef4444" stroke-width="2" filter="url(#shadow)" />
  <text x="955" y="475" fill="#f87171" font-size="15" font-weight="700">5. ERROR QUARANTINE</text>
  <line x1="955" y1="485" x2="1130" y2="485" stroke="#334155" stroke-width="1.5" />
  <rect x="955" y="495" width="180" height="40" rx="6" fill="#1e293b" stroke="#ef4444" />
  <text x="965" y="515" fill="#fecaca" font-size="11" font-weight="600">pipeline_errors</text>
  <text x="965" y="528" fill="#94a3b8" font-size="10">Row index, raw input, errors</text>
  <rect x="955" y="545" width="180" height="45" rx="6" fill="#1e293b" stroke="#475569" />
  <text x="965" y="565" fill="#e2e8f0" font-size="11" font-weight="600">Redacted Attributes</text>
  <text x="965" y="578" fill="#94a3b8" font-size="10">Configured raw fields masked</text>
  <rect x="955" y="600" width="180" height="60" rx="6" fill="#1e293b" stroke="#f59e0b" />
  <text x="965" y="620" fill="#fde68a" font-size="11" font-weight="600">Surgical Retry</text>
  <text x="965" y="635" fill="#94a3b8" font-size="10">Row-level attribution</text>
  <text x="965" y="648" fill="#94a3b8" font-size="10">Streaming chunkById (O(1))</text>
  <text x="965" y="710" fill="#f87171" font-size="11" font-weight="600">Row-Attributed Quarantine</text>

  <!-- Surgical Retry Loopback arrow -->
  <path d="M 940 630 L 600 630 L 600 400" stroke="#f59e0b" stroke-width="2" stroke-dasharray="6,6" marker-end="url(#arrow)" />
  <text x="650" y="620" fill="#fde68a" font-size="11" font-weight="600">pipeline:retry-failed (re-executes stages exclusively for errors)</text>

  <!-- 6. Repository Checkpoints -->
  <rect x="330" y="440" width="550" height="150" rx="10" fill="url(#grad-stage)" stroke="#3b82f6" stroke-width="2" filter="url(#shadow)" />
  <text x="350" y="475" fill="#60a5fa" font-size="16" font-weight="700">6. REPOSITORY CHECKPOINTS &amp; RESUMABILITY</text>
  <line x1="350" y1="485" x2="860" y2="485" stroke="#334155" stroke-width="1.5" />
  <text x="350" y="515" fill="#e2e8f0" font-size="10">pipeline_runs: status, processed_records, successful_records, failed_records, duration</text>
  <text x="350" y="540" fill="#e2e8f0" font-size="10">pipeline_chunks: sequence, status, offsets, lease_token; dedup claims committed in the same transaction</text>
  <text x="350" y="565" fill="#93c5fd" font-size="11" font-weight="600">Resume: replay stable source; retry: restore masked fields, commit writes + quarantine cleanup together</text>
</svg>
